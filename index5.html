<!DOCTYPE html>
<html>
    <head>
        <title>Student Registraction</title>
    </head>
    <body>
        <h1>Student Registraction</h1>
        <p>Fill in your details to create a student account.</p>
        <hr>
        <form>
            <label>Full name *</label>
            <input type="text" placeholder="enter your full name"><br><br>
            <label>Email Address *</label>
            <input type="email" placeholder="jane@example.com"><br><br>
<label>Password *</label>
            <input type="password" placeholder="Atleast 8 characters"><br><br>
            <hr>
<h2>Gender *</h2>
<input type="radio" name="gender" id="male">
<label for="male">Male</label>
<input type="radio" name="gender" id="female">
<label for="female">Female</label>
<input type="radio" name="gender" id="non-binary">
<label for="non-binary">Nnn-binary</label>
<input type="radio" name="gender" id="notsay">
<label for="notsay">Prefer not to say</label>
        </form>
        <br><br>
        <hr>

        <h2>Skills (select all that apply)</h2>

        <input type="checkbox" id="html">
        <label for ="html">HTML&CSS</label>

       <input type="checkbox" id="js">
        <label for ="js">Java Script</label>

      <input type="checkbox" id="python">
        <label for ="python">Python</label>

        
    <input type="checkbox" id="react">
        <label for ="react">React</label>


<input type="checkbox" id="sql">
        <label for ="sql">SQL</label>
        <br><br>

<input type="checkbox" id="ui">
        <label for ="ui">UI Design</label>
<br><br><br>
<button type="submit">Create Account</button>
    </form>
</body>
</html>
